name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to retry (e.g. v2.0.0-rc.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}

jobs:
  test:
    name: Validate release on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      commit: ${{ steps.release.outputs.commit }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.version || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Validate tag, version, and release notes
        id: release
        run: |
          node scripts/check-release.cjs --self-test
          node scripts/check-release.cjs "$RELEASE_TAG"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run quality:check

      - name: Test source and built imports
        run: |
          npm run test:node-versions
          npm run test:imports
          npm run test:imports:built

      - name: Pack validated package
        if: matrix.node-version == 22
        run: |
          npm pack --ignore-scripts
          tar -tf rule-engine-js-*.tgz > "$RUNNER_TEMP/package-contents.txt"
          for file in package/dist/index.js package/dist/index.cjs package/dist/index.esm.js package/types/index.d.ts package/CHANGELOG.md; do
            grep -Fx "$file" "$RUNNER_TEMP/package-contents.txt"
          done

      - name: Upload validated package
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: rule-engine-js-*.tgz

  publish:
    name: Publish validated package to npm
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Download validated package
        uses: actions/download-artifact@v4
        with:
          name: npm-package

      - name: Publish package
        env:
          DIST_TAG: ${{ needs.test.outputs.dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./rule-engine-js-*.tgz --tag "$DIST_TAG"

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [test, publish]
    permissions:
      contents: write
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.commit }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download published package
        uses: actions/download-artifact@v4
        with:
          name: npm-package

      - name: Extract release notes
        id: release
        run: node scripts/check-release.cjs "$RELEASE_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          body_path: ${{ steps.release.outputs.notes_file }}
          files: rule-engine-js-*.tgz
          fail_on_unmatched_files: true
          prerelease: ${{ needs.test.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.test.outputs.prerelease == 'false' }}
          target_commitish: ${{ needs.test.outputs.commit }}
